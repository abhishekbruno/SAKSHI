name: SAKSHI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend & Frontend Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sakshi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Backend Test Suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///:memory:
          EMBEDDING_PROVIDER: deterministic_mock
          ANTIVIRUS_SCANNER: eicar_heuristic
          AUTH_MODE: development
          PYTHONPATH: backend
        run: |
          cd backend
          pytest tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Frontend Verification Suite
        run: |
          node frontend/test_login_verification.js
          node frontend/test_fir_ingestion_regression.js

