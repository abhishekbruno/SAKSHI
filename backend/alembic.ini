# Alembic configuration for SAKSHI Investigation Platform
# Configured for dual-dialect support: SQLite (local dev/test) and PostgreSQL (staging/production)

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

# Prepend application root to sys.path so app modules can be resolved
prepend_sys_path = %(here)s
path_separator = os


# Timezone for revision timestamps
timezone = UTC

# sqlalchemy.url is resolved dynamically from app.core.config.settings.DATABASE_URL in env.py
sqlalchemy.url = 

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
