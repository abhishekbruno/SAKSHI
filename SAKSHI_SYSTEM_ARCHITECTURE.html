---

# SECTION A — System Overview

**SAKSHI** ("The Incorruptible Witness") is an evidence-gated artificial intelligence reasoning and case-memory companion engineered specifically for statutory death investigations. In unnatural death and homicide investigations, Investigating Officers (IOs) face massive evidentiary friction: disorganized multi-modal case records, contradictory witness testimonies, complex post-mortem reports, voluminous Call Detail Records (CDRs), and high-pressure investigative timelines. Cognitive vulnerabilities such as premature cognitive closure, confirmation bias, and heuristic profiling have historically contributed to fatal investigative errors and miscarriages of justice.

Sakshi is architectured not to automate justice, but to enforce rigorous evidentiary discipline. It ingests multi-modal case documents—starting from the First Information Report (FIR)—constructs an immutable, structured case memory, extracts invariant entities and hard machine-verifiable identifiers, builds a continuous chronological timeline, flags contradictions across statements, exposes procedural and evidentiary omissions (investigative gaps), and formulates evidence-backed investigative directions.

At the core of Sakshi is an **Asymmetric Two-Brain Architecture**:
- **The Intuition Brain (LLM-based Discovery Layer):** Operates within an isolated informational sandbox to synthesize context, identify patterns, spot temporal inconsistencies, and formulate candidate investigative hypotheses. It is structurally prohibited from directly communicating with or presenting unverified claims to the investigator.
- **The Discipline Brain (Deterministic Verification & Gating Layer):** Acts as a mandatory judicial firewall. It intercepts every candidate hypothesis generated by the Intuition Brain, decomposes it into atomic factual propositions, and executes deterministic verification queries against cryptographically hashed primary source records. If a claim lacks unbroken documentary proof, it is either flagged as an unverified lead or rejected.

Crucially, Sakshi features a **Hard-Identifier Cross-Case Safeguard**: cross-case associations are strictly permitted only on exact matches of machine-verifiable tokens (Phone Numbers, IMEI, Vehicle Plates, Bank Accounts). All heuristic cross-case linkage based on appearance, behavioral patterns, personality profiling, or Modus Operandi (MO) is **hard-blocked at the kernel level**.

# SECTION B — Design Principles & Anti-Goals

### 1. Core Operating Principles
1. **The Cardinal Anti-Suspect Principle:** Sakshi must **NEVER** name, rank, recommend, implicate, predict, or calculate the probability of guilt for any suspect. Culpability scoring and automated accusations are strictly prohibited.
2. **Absolute Source Traceability (Grounding Ratio = 1.0):** Every fact presented as verified on the investigator's console must possess a direct, cryptographically validated citation pointing to an exact document ID, page, paragraph, and line span.
3. **The Mandatory Two-Brain Gate:** Generative language models may brainstorm and detect candidate anomalies, but only deterministic verification engines may approve output for the user.
4. **Human Primacy (Human-in-the-Loop):** The human Investigating Officer remains the sole decision-maker, exercising statutory authority, conducting field inquiries, and drawing judicial conclusions. Sakshi assists by organizing evidence, exposing gaps, and mapping contradictions.
5. **Deterministic Legal Procedural Control:** Statutory legal requirements (e.g., inquest formalities under CrPC/BNSS, medical post-mortem requisitions, forensic sample custody) are evaluated by a rule engine, completely decoupled from LLM inference.
6. **Immutable Evidentiary Provenance:** All raw files, AI prompt transactions, verification steps, and officer decisions are committed to an append-only, tamper-evident cryptographic Merkle audit log.

### 2. Explicit System Anti-Goals (Kernel-Level Prohibitions)
- ❌ **NO Suspect Ranking:** The system will not output "Top Suspects" or probabilistic suspect likelihoods.
- ❌ **NO Guilt Prediction:** Algorithms will not assign guilt percentages to any individual.
- ❌ **NO Behavioral or Psychological Profiling:** The system will not infer deceptive personality traits, criminal inclinations, or moral character.
- ❌ **NO Appearance-Based Cross-Case Matching:** Computer vision facial similarity or witness description matching across cases is barred.
- ❌ **NO Modus Operandi (MO) Linkage:** Cases will not be correlated based on subjective behavioral or methodological similarities.
- ❌ **NO Silent Hallucination:** The system will never present an uncorroborated AI hypothesis disguised as an established fact.

# SECTION D — Component Architecture & Responsibilities

1. **Investigator Web Console (Next.js/React):** The primary user interface rendering the interactive chronological timeline, side-by-side evidence citation viewer, contradiction matrix, gap board, and hypothesis board.
2. **Voice Assistant Interface (WebRTC / Local Whisper):** Allows field investigators to dictate notes, record Malayalam-English mixed witness interviews, and execute voice-driven queries against case memory.
3. **API Gateway & Access Control (Kong / Keycloak):** Enforces TLS 1.3, mTLS, OAuth2/OIDC authentication, role-based and attribute-based access control (RBAC/ABAC), and jurisdictional tenant isolation.
4. **Case Management Service (FastAPI):** Oversees case registration, FIR intake, IO assignment, investigation milestones, and case diary maintenance.
5. **Evidence Ingestion & Hashing Service:** Computes SHA-256 and SHA-3-512 dual-checksums on inbound binaries, validates file signatures, runs anti-virus inspection (ClamAV), and writes immutably to WORM storage.
6. **Multi-Modal OCR & Document Layout Service:** Employs Tesseract, PaddleOCR, and layout parsers to convert scanned police panchnamas, typed statements, and tabular records into structured text and tables.
7. **Bilingual Speech-to-Text Service:** Specialized ASR pipeline running fine-tuned Whisper models capable of transcribing code-switched Malayalam and English speech.
8. **NLP & Information Extraction Engine:** Uses fine-tuned Legal-Clinical transformer models to extract named entities, atomic event tuples, temporal intervals, and machine-verifiable identifiers.
9. **Structured Case Memory Service:** Orchestrates data synchronization between the relational database (PostgreSQL 16) and the property knowledge graph (Neo4j Enterprise).
10. **Chronological Timeline Engine:** Maps events along continuous temporal coordinates, applying Allen's Interval Algebra to detect impossible spatio-temporal travel speeds and chronological overlaps.
11. **Deterministic Legal / Procedural Rule Engine:** A non-LLM, rule-based statutory engine verifying compliance with criminal procedure codes (e.g., 24-hour magistrate reporting, inquest formalities, mandatory forensic sample dispatches).
12. **Intuition Brain Inference Service:** Self-hosted vLLM engine running open-source models (e.g., Llama-3-70B-Instruct) in an air-gapped environment. Synthesizes context to generate candidate insights.
13. **Discipline Brain Verification Kernel:** Decomposes candidate insights into atomic claims, executes semantic span and exact string matches against primary document OCR text, and measures grounding ratios.
14. **Evidence Gate:** Strictly filters claims: assigns `VERIFIED` status only to claims with 100% evidentiary backing; routes unsupported claims to `UNVERIFIED LEADS` or `INVESTIGATIVE GAPS`.
15. **Investigative Gap Engine:** Analyzes the knowledge graph to detect missing corroborative evidence, unverified statements, and incomplete statutory procedures.
16. **Cross-Case Hard-Identifier Linker:** Exact-match query engine scanning indexed phone numbers, IMEIs, vehicle plates, and bank accounts across independent case databases.
17. **Append-Only Merkle Audit Service:** Maintains a cryptographic, tamper-evident audit trail of every ingested byte, model interaction, verification check, and IO decision.
18. **Statutory Certificate Generator:** Produces digitally signed certificates of electronic record integrity compliant with Section 65B of the Indian Evidence Act / Section 63 of the Bharatiya Sakshya Adhiniyam (BSA).
19. **Forensic Science Laboratory (FSL) Integration Gateway:** Secure REST/mTLS gateway for automated, cryptographically signed intake of official laboratory toxicology, ballistics, and DNA reports.
20. **Case Diary & Report Generation Engine:** Assembles statutory daily case diaries, evidence summaries, and gap audit reports, cleanly segregating verified facts from unverified leads.

# SECTION G — Two-Brain Reasoning Architecture

The Two-Brain Architecture resolves the tension between LLM generative fluency and the absolute evidentiary precision required in judicial inquiries.

### 1. The Intuition Brain
- **Core Technology:** Self-hosted open-source foundation model (e.g., Llama-3-70B-Instruct, Mistral-Large) running on an air-gapped on-premise GPU cluster via vLLM.
- **Role:** Synthesis, pattern recognition, anomaly spotting, hypothesis generation, and gap detection.
- **Operational Boundary:** Consumes structured timeline JSON and case subgraph packets. It is strictly constrained by system prompts to search for **inconsistencies, missing testimonies, uncollected physical items, and timeline conflicts**.
- **Containment:** The Intuition Brain has no direct access to user-facing API routes or presentation layers. It emits a strongly typed `CandidateInsightPayload` into an internal buffer.

### 2. The Discipline Brain
- **Core Technology:** Deterministic Python/Rust verification engine utilizing exact string matching, RapidFuzz, SQL relational queries, Cypher graph lookups, and DeBERTa-v3-large-MNLI for natural language entailment verification.
- **Role:** Verification, source traceability, claim validation, contradiction analysis, and court-admissibility enforcement.
- **Operational Pipeline:**
  1. Receives `CandidateInsightPayload`.
  2. Decomposes compound assertions into discrete atomic claims.
  3. Validates that every cited `source_evidence_id` exists in the WORM storage vault with an intact hash.
  4. Scans the OCR text stream of the primary document to locate the exact text span cited.
  5. Computes the **Grounding Ratio**:
     $$\text{Grounding Ratio} = \frac{\text{Count of Cryptographically Grounded Atomic Claims}}{\text{Total Atomic Claims in Hypothesis}}$$
  6. Evaluates whether the claim contradicts established forensic ground truths (e.g., Post-Mortem Time Since Death interval).

# SECTION H — The Evidence Gate

The Evidence Gate is the central control mechanism standing between AI reasoning and investigator-facing displays. It evaluates every factual assertion against an eight-point verification rubric:

1. **Claim Identity:** Is the assertion an atomic, non-compound proposition?
2. **Documentary Existence:** Does the supporting evidence record exist in the repository?
3. **Integrity Validation:** Does the file's current SHA-256 hash match its registration hash?
4. **Source Authenticity:** Is the author/recording officer of the document identified?
5. **Exact Span Localization:** Can the claimed fact be pointed to on a specific page and line?
6. **Semantic Entailment:** Does the text span logically support the claim without extrapolation?
7. **Forensic Consistency:** Does the assertion conflict with objective medical/forensic facts?
8. **Sufficiency Threshold:** Is the claim corroborated by primary or secondary documentary evidence?

                                  ▼

[VERIFIED FACT]          [UNVERIFIED LEAD]            [CONTRADICTION]
- Grounding = 1.0        - Grounding < 1.0           - Clashes with
- Hash verified          - Uncorroborated statement    established fact
- Displayed with direct  - Flagged for field          - Displayed in
  clickable citation       corroboration               resolution matrix
```

# SECTION I — Structured Case Memory & Knowledge Graph

The Case Memory is a hybrid multi-model architecture. Vector embeddings and semantic indexes are utilized **exclusively for retrieval acceleration**; they are strictly barred from serving as the ground truth. The authoritative single source of truth resides in the **Relational Database** and the **Property Knowledge Graph**.

### Core Knowledge Graph Ontology (Neo4j)
- **Node Labels:** `Person`, `EvidenceItem`, `Document`, `Statement`, `Event`, `Location`, `TimeInterval`, `MedicalFinding`, `HardIdentifier`, `Contradiction`, `InvestigativeGap`, `NextStep`.
- **Edge Types:**
  - `(:Person)-[:MADE_STATEMENT]->(:Statement)`
  - `(:Statement)-[:RECOUNTS]->(:Event)`
  - `(:Event)-[:OCCURRED_AT]->(:Location)`
  - `(:Event)-[:WITHIN_INTERVAL]->(:TimeInterval)`
  - `(:Person)-[:ASSOCIATED_WITH]->(:HardIdentifier)`
  - `(:EvidenceItem)-[:PROVES]->(:Event)`
  - `(:EvidenceItem)-[:CONTAINS]->(:MedicalFinding)`
  - `(:Statement)-[:CONFLICTS_WITH]->(:Statement)`
  - `(:MedicalFinding)-[:REFUTES]->(:Statement)`
  - `(:InvestigativeGap)-[:PERTAINS_TO]->(:Event)`

Every relationship carries provenance metadata: `evidence_id`, `page_number`, `confidence_score`, `verified_by_officer_id`, and `last_updated_timestamp`.

# SECTION J — Timeline Construction & Contradiction Engine

### 1. Timeline Engine
- Aggregates all extracted temporal markers across FIR, witness statements, post-mortem findings, CCTV logs, and CDR call sessions.
- Converts fuzzy or relative temporal expressions (e.g., "half an hour after sunset", "around tea time") into formal ISO 8601 temporal intervals: `[start_timestamp, end_timestamp]` with explicit uncertainty bounds.
- Solves interval sequences using Allen's Interval Temporal Logic (`BEFORE`, `MEETS`, `OVERLAPS`, `DURING`, `EQUALS`).
- Evaluates spatial transit feasibility: computes minimum physical travel time between consecutive locations using geographic coordinates and road networks. If required transit velocity exceeds physical feasibility (e.g., > 120 km/h in urban traffic), an anomaly is automatically flagged.

### 2. Contradiction Detection Engine
- Detects factual collisions across three primary axes:
  1. **Temporal Clashes:** Witness A states X was at Location L1 at 21:00; Tower CDR registers phone at Location L2 (25 km away) at 21:05.
  2. **Forensic vs. Testimonial Clashes:** Witness B asserts the deceased was assaulted with a wooden stick; Post-Mortem Report determines cause of death as organophosphate chemical poisoning with zero blunt force trauma.
  3. **Direct Testimonial Clashes:** Witness C claims the victim arrived alone; Witness D claims the victim arrived with two unknown companions.
- **Rule of Non-Resolution:** Sakshi **never** automatically decides which witness is lying or which account is true. It exposes both conflicting nodes side-by-side with complete provenance, leaving evaluation to the human investigator.

# SECTION K — Investigative Gap Engine

The Investigative Gap Engine scans the case memory to identify evidentiary voids, missing procedural steps, and unverified assertions.

### Taxonomy of Detected Gaps
1. **Uncorroborated Alibis / Movements:** A person claims an alibi during the estimated Time Since Death interval, but no physical, digital, or secondary witness corroboration exists.
2. **Missing Forensic Protocols:** An inquest report notes blood pooling at the scene, but no forensic blood-typing or DNA swabbing receipt is present in the case vault.
3. **Chain of Custody Lapses:** Physical evidence was seized on Date D1, but FSL dispatch entry is not recorded within statutory time limits.
4. **Unaccounted Chronological Blocks:** An unexplained gap of > 60 minutes exists in the deceased's verified timeline immediately preceding the estimated time of death.
5. **Telecom Discrepancies:** Phone calls are recorded between key entities during critical intervals, but corresponding subscriber detail records (SDR) or cell tower locations have not been summoned under statutory notices.

For every detected gap, the engine generates an **Evidence-Backed Next Step** (e.g., *"Issue notice under Sec 91 CrPC / BNSS to Telecom Provider for Tower CDR of Cell ID 404-21-982 for interval 22:00-23:30"*).

# SECTION L — Deterministic Legal / Procedural Rule Engine

The Legal Rule Engine is a **strictly deterministic, non-LLM subsystem**. It codifies statutory procedural requirements under the Code of Criminal Procedure (CrPC) / Bharatiya Nagarik Suraksha Sanhita (BNSS), Indian Penal Code (IPC) / Bharatiya Nyaya Sanhita (BNS), and Indian Evidence Act (IEA) / Bharatiya Sakshya Adhiniyam (BSA).

```
                      [Case State Update]
                              │
                              ▼
                [Deterministic Rule Evaluator]
                              │
              ┌───────────────┴───────────────┐
              ▼                               ▼
    [Mandatory Requirement]        [Procedural Deadline]
    (e.g., Inquest under Sec 174)  (e.g., 24-hr Remand Rule)
              │                               │
              ▼                               ▼
    {Condition Satisfied?}          {Deadline Expired?}
         ├── YES ──> [Compliant]         ├── NO  ──> [Active Tracker]
         └── NO  ──> [PROCEDURAL ALERT]  └── YES ──> [STATUTORY BREACH ALERT]
```

### Key Rule Specifications
- **Rule REG-01 (Inquest Completion):** For unnatural death cases, verification that Form 174 / Inquest Panchnama is signed by required panchas and submitted to the Executive Magistrate.
- **Rule REG-02 (Post-Mortem Requisition):** Verification that medical autopsy report is officially linked to the registered FIR/Inquest number.
- **Rule REG-03 (Electronic Evidence Certification):** Enforces mandatory creation of Section 65B IEA / Section 63 BSA hash certificates for all digital devices, CDR dumps, and CCTV drives at the moment of seizure.
- **Rule REG-04 (Viscera Preservation):** If post-mortem cause of death is pending chemical analysis, rules check for the entry of viscera dispatch to the State Forensic Science Laboratory within 72 hours.

# SECTION N — Human-in-the-Loop (HITL) Architecture

Sakshi enforces clear separation between computational processing and judicial decision-making:
- **What the System Does:** Organizes multi-modal evidence; parses complex timelines; detects statement contradictions; exposes missing evidence/procedural gaps; verifies claims against source documents; generates evidence-backed next steps.
- **What the System NEVER Does:** Decides whether a person is lying; predicts culpability; suggests who to arrest; draws final legal conclusions.
- **Investigator Prerogatives:** The IO inspects primary document citations via click-to-preview; resolves contradiction flags by recording re-interrogations; accepts or rejects suggested next steps; enters mandatory statutory justifications for deferred steps.

# SECTION O — Security, Cryptographic Integrity & On-Premise Architecture

### 1. Sovereign On-Premise Air-Gapped Deployment
To protect sensitive police data and comply with national data sovereignty laws, Sakshi is engineered to run entirely within controlled police network infrastructure. All LLM inferences, vector embeddings, and speech models execute on local, on-premise GPU servers with **zero external cloud connectivity**.

### 2. Multi-Layer Cryptographic Security
- **Dual Hashing at Ingestion:** Every uploaded file is processed through streaming SHA-256 and SHA-3-512 hashing before reaching storage.
- **WORM Storage:** Raw evidence files are locked in Write-Once-Read-Many (WORM) storage using S3 Compliance Object Locking. Deletions and modifications are cryptographically impossible.
- **Envelope Encryption:** Data at rest is encrypted using AES-256-GCM. A dedicated Hardware Security Module (HSM) / Key Management Service (KMS) provisions unique cryptographic keys per case workspace.
- **Transit Encryption:** All internal microservice communications enforce TLS 1.3 with mutual authentication (mTLS).
- **Append-Only Merkle Audit Trail:** System events, AI model versions, prompts, and officer interactions are committed to a Merkle tree-based immutable ledger (Immudb).

# SECTION Q — The 22 Development Phases

### Phase 1 — Requirement Analysis & Statutory Boundary Definition
- **Objective:** Codify statutory death investigation workflows (CrPC/BNSS, IEA/BSA) and lock the Cardinal Anti-Suspect Principle.
- **Inputs:** State Police Manuals, Statutory Criminal Codes, Forensic Inquest SOPs.
- **Components:** System Policy Engine, Legal Requirements Specification.
- **Processing:** Translating statutory inquest steps into deterministic operational schemas; codifying hard-identifier constraints.
- **Storage:** Git repository, Policy JSON Schemas.
- **AI Models:** None.
- **APIs:** None.
- **Outputs:** Architectural Requirements Document, Anti-Goals Matrix, JSON Schema Specifications.
- **Validation:** Review and sign-off by legal and digital forensics experts.
- **Security:** Policy-level definitions of zero-trust RBAC/ABAC boundaries.
- **Dependencies:** None.

### Phase 2 — System & Database Design
- **Objective:** Architect schemas across all 10 storage engines ensuring referential integrity and strict case isolation.
- **Inputs:** Requirements from Phase 1.
- **Components:** Relational DB Schema Designer, Neo4j Graph Modeler, WORM Vault Configurator.
- **Processing:** Normalization of legal entity models; design of append-only audit ledger structures.
- **Storage:** PostgreSQL 16 DDL, Neo4j Graph Cypher DDL, MinIO Bucket Policies.
- **AI Models:** None.
- **APIs:** Internal DB migration scripts (Alembic).
- **Outputs:** ER diagrams, Graph Ontologies, Storage Configurations.
- **Validation:** Automated migration tests, foreign key integrity benchmarks.
- **Security:** Multi-tenant cryptographic schema isolation (unique schema per case).
- **Dependencies:** Phase 1.

### Phase 3 — Secure Case Management Layer
- **Objective:** Implement case lifecycle management, FIR registration, and investigator assignment.
- **Inputs:** Case registration metadata, FIR text.
- **Components:** Case Management Service, Keycloak Identity Service.
- **Processing:** Case creation, officer assignment, stage transitions (FIR -> Inquest -> Active Inquiry -> Final Report).
- **Storage:** PostgreSQL `cases`, `officers`, `case_stages` tables.
- **AI Models:** None.
- **APIs:** `/api/v1/cases`, `/api/v1/cases/{id}/assign`.
- **Outputs:** Active Case Workspaces, Initial Case Context Records.
- **Validation:** 100% unit test coverage of permission transitions and stage locks.
- **Security:** RBAC enforcement; access restricted strictly to assigned IOs and verified supervisors.

### Phase 4 — Multi-Modal Evidence Ingestion Pipeline
- **Objective:** Construct high-throughput, secure multi-modal evidence ingestion with dual-hashing.
- **Inputs:** Scanned PDFs, images, CDR spreadsheets, audio recordings.
- **Components:** Ingestion Controller, Anti-virus Scanner (ClamAV), Dual-Hasher.

### Phase 5 — OCR & Bilingual Speech Processing
- **Objective:** Convert scanned records and voice recordings into clean, normalized text.
- **Inputs:** PDF scans, panchnama photos, voice notes, audio interviews.

# SECTION S — Database & Data Storage Architecture

Sakshi segregates case data across 10 specialized storage engines:

1. **DS-1: Raw Evidence Object Storage (MinIO Enterprise):** WORM-compliant S3 storage holding raw unmodified evidentiary binaries (scanned PDFs, photographs, audio recordings, CDR spreadsheets). Configured with Object Lock in Compliance Mode.
2. **DS-2: Processed Evidence Store (MinIO / PostgreSQL):** Cleaned text files, normalized CSV tables, OCR bounding box files, and ASR word-level timestamp transcriptions.
3. **DS-3: Structured Case Database (PostgreSQL 16):** Fully normalized relational schema storing case metadata, officer profiles, canonical entities, timeline intervals, and legal compliance states.
4. **DS-4: Case Knowledge Graph (Neo4j Enterprise):** Property graph housing all entities, relationships, assertions, and evidentiary provenance citations.
5. **DS-5: Vector Semantic Retrieval Store (Qdrant):** Dense embeddings of document paragraphs used exclusively for semantic candidate retrieval. Strictly partitioned by Case ID.
6. **DS-6: Evidence-Claim Mapping Store (PostgreSQL):** Maps every atomic claim to its primary source evidence ID, text span coordinates, grounding ratio, and verification status.
7. **DS-7: Append-Only Reasoning & Audit Store (Immudb):** Cryptographic Merkle tree ledger recording all system events, AI prompts, model outputs, verification queries, and investigator actions.
8. **DS-8: Identity & Access Management Store (Keycloak PostgreSQL):** Manages user credentials, role definitions, attribute-based access policies, and MFA registrations.
9. **DS-9: Search Index (Elasticsearch / OpenSearch):** Full-text search index across all OCR transcripts and case notes, supporting boolean and proximity searches.
10. **DS-10: Cold Backup & Disaster Recovery Storage:** Encrypted, off-site, air-gapped physical tape or disconnected disk backups updated via daily snapshots.
