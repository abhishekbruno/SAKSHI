services:
  - type: web
    name: sakshi-investigation-workstation
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: sakshi-evidence-workspaces
      mountPath: /sakshi/workspaces
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: development
      - key: EMBEDDING_PROVIDER
        value: deterministic_mock
      - key: ANTIVIRUS_SCANNER
        value: eicar_heuristic
      - key: DATABASE_URL
        fromDatabase:
          name: sakshi-postgres
          property: connectionString

databases:
  - name: sakshi-postgres
    plan: standard
    databaseName: sakshi_cases
    user: sakshi_user
